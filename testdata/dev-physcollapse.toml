# T-1907's own dev config: identical shape to testdata/dev.toml, on a
# distinct port pair (68006/68007) and pointed at the phys-collapse fixture
# — the physical-layer-collapse case (10 NICs on one node, over
# topology.DefaultPhysicalCollapseThreshold) web/e2e/physical-collapse.spec.ts
# drives: the "phys-group:pve1" pill renders by default, and expanding it
# restores the individual NICs. Runs alongside the other e2e webServer pairs
# without collision (see web/playwright.config.ts).

[server]
listen = "127.0.0.1:68007"
tls_cert = "testdata/certs/dev-cert.pem"
tls_key = "testdata/certs/dev-key.pem"
read_only = false
confirm_timeout_default = 120

[pve]
api_url = "http://127.0.0.1:68006"
token_file = "/etc/vnprox/keys/pve-token"
dev_ticket_username = "root@pam"
dev_ticket_password = "vnprox-mock"

[safety]
allow_dangerous_ops = false
protected_path = "var/dev-physcollapse-protected.json"
dev_interfaces_dir = "var/dev-physcollapse-host"

[storage]
db_path = "var/dev-physcollapse-vnprox.db"
session_key_file = "var/dev-physcollapse-session.key"

[peer]
secret_path = "var/dev-physcollapse-cluster.secret"

[collect]
pve_interval = "10s"
host_interval = "5s"
lldp_interval = "30s"

[metrics]
key_file = "var/dev-physcollapse-metrics.key"

# T-1307: blueprint signing needs the same var/ override every other
# key/token path above already has — see dev-mgmt.toml's identical T-1001
# precedent for why (missing here broke vnproxd startup on any host/sandbox
# without a pre-existing, writable /etc/vnprox).
[blueprint]
signing_key_file = "var/dev-physcollapse-blueprint-signing.key"
trusted_signers_dir = "var/dev-physcollapse-trusted-signers"
