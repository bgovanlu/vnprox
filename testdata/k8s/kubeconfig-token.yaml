# T-1501 fixture: a minimal, valid bearer-token kubeconfig — the common
# shape a service-account token kubeconfig takes. certificate-authority-data
# is a throwaway self-signed CA cert generated solely for this fixture
# (openssl req -x509 -newkey rsa:2048 -days 3650 -nodes), not a real
# credential of any kind. The server URL is a placeholder; internal/k8s
# tests that need a live endpoint override ResolvedConfig.Server after
# parsing (ResolveContext still exercises this file's own parse/resolve
# path end to end).
apiVersion: v1
kind: Config
current-context: vnprox-readonly
clusters:
  - name: demo-cluster
    cluster:
      server: https://k8s.example.internal:6443
      certificate-authority-data: 
contexts:
  - name: vnprox-readonly
    context:
      cluster: demo-cluster
      user: vnprox-viewer
users:
  - name: vnprox-viewer
    user:
      token: eyJhbGciOiJSUzI1NiIsImtpZCI6InRlc3QtdG9rZW4ifQ.test-payload.test-signature
