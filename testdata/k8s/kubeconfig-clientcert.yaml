# T-1501 fixture: a client-certificate-authenticated kubeconfig — the
# ResolveContext credential branch a token kubeconfig doesn't exercise.
# cert.pem/key.pem here are a throwaway self-signed pair generated solely
# for this fixture (openssl req -x509 -newkey rsa:2048 -days 3650 -nodes),
# not a real credential of any kind.
apiVersion: v1
kind: Config
current-context: vnprox-readonly
clusters:
  - name: demo-cluster
    cluster:
      server: https://k8s.example.internal:6443
      certificate-authority-data: 
contexts:
  - name: vnprox-readonly
    context:
      cluster: demo-cluster
      user: vnprox-viewer
users:
  - name: vnprox-viewer
    user:
      client-certificate-data: 
      client-key-data: 
