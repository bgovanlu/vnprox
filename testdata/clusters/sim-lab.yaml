# sim-lab.yaml — T-504 fixture: a small 2-node cluster purpose-built for
# the path simulator UI's E2E coverage (planning/tasks/phase-5.md T-504),
# demonstrating both acceptance-criterion scenarios in one fixture rather
# than editing three-node-vlan.yaml (widely shared by other tasks' e2e
# specs) or firewall-scenarios.yaml (single-node, no cross-node L2 case):
#
#   - AC1 "why can't VM A reach VM B": vm-a and vm-c share pve1's vmbr0 at
#     VLAN 100 — vm-c carries its own guest-scope DROP rule for tcp/80, so
#     vm-a -> vm-c on tcp/80 is a clean deny with a blocking rule the UI
#     can deep-link into (no address-restricted rule involved, so this
#     also sidesteps T-503's documented guest-ip-unknown caveat rather than
#     needing an indeterminate result for this particular scenario).
#   - AC2 unreachable-VLAN: vm-b lives on pve2, whose vmbr0 is deliberately
#     NOT VLAN-aware (bridge_vlan_aware omitted/false) while pve1's vmbr0
#     is. vm-a (pve1, tag=100) -> vm-b (pve2, tag=100) trips
#     internal/sim/l2.go's trunkCheck bridge_not_vlan_aware branch — a
#     "VLAN case" fixture-producible without a bridge-vids restriction
#     (which the pvemock fixture schema/renderer has no field for at all;
#     Bridge.Vids in the resolved inventory is only ever populated from
#     real host-netlink observation — internal/inventory/ingest.go — and
#     this e2e harness runs host.NewReal() against whatever machine executes
#     the test, never a fixture-backed host reader, so an empty/unrestricted
#     Vids set is the only value achievable here regardless of what this
#     YAML says; VlanAware, unlike Vids, IS carried straight from PVE's own
#     `bridge_vlan_aware` network config — see FromPVENetwork in
#     internal/inventory/ingest.go — so this mismatch is fully
#     fixture-driven and deterministic).
#   - AC5 trace-path: vm-a/vm-b/vm-c are all guest-nic-kind map entities,
#     so "Trace path from/to here" (web/src/simulator/traceLink.ts) has
#     real endpoints for guest->guest (vm-a/vm-c or vm-a/vm-b),
#     guest->external (vm-a -> the WAN, pve1's vmbr0 has a gateway), and
#     IP->guest (a literal IP typed as source, vm-a as the traced
#     destination).
cluster:
  name: pve-sim-lab
  quorate: true
  nodes:
    - name: pve1
      ip: 10.20.0.11
      online: true
    - name: pve2
      ip: 10.20.0.12
      online: true

users:
  - userid: root@pam
    password: vnprox-mock
    privileges: ["*"]
    tokens:
      - tokenid: daemon
        secret: 9c2f7a1e-4b3d-4a90-8e1a-6f0d2c5b8a17

nodes:
  pve1:
    network:
      - iface: lo
        type: loopback
        method: loopback
        autostart: true
      - iface: eno1
        type: eth
        method: manual
        autostart: true
        mtu: 1500
      - iface: eno2
        type: eth
        method: manual
        autostart: true
        mtu: 1500
      - iface: bond0
        type: bond
        method: manual
        autostart: true
        mtu: 1500
        slaves: "eno1 eno2"
        bond_mode: 802.3ad
        comments: "LACP to access switch"
      - iface: vmbr0
        type: bridge
        method: static
        address: 10.20.0.11/24
        gateway: 10.20.0.1
        autostart: true
        mtu: 1500
        bridge_ports: bond0
        bridge_vlan_aware: true
        comments: "VLAN-aware access bridge"
    links:
      eno1: {mac: "bc:24:11:20:00:01", driver: igb, speed_mbps: 10000, duplex: full, link_up: true}
      eno2: {mac: "bc:24:11:20:00:02", driver: igb, speed_mbps: 10000, duplex: full, link_up: true}
      bond0: {mac: "bc:24:11:20:00:01", link_up: true}
      vmbr0: {mac: "bc:24:11:20:00:01", link_up: true}
    qemu:
      "300":
        name: vm-a
        status: running
        config:
          name: vm-a
          cores: "1"
          memory: "512"
          net0: "virtio=BC:24:11:AA:20:01,bridge=vmbr0,tag=100,firewall=1"
          ostype: l26
        firewall:
          enabled: true
          rules: []
        # T-802: POST /simulate/verify's scripted live-probe table, exec'd
        # *from* vm-a toward vm-c's own agent-reported IP (below) — matched
        # directly against this fixture's tcp/22 "allow" Simulate case (see
        # vm-c's own pos-1 ACCEPT rule below). internal/api's own
        # POST /simulate/verify tests override this table at load time
        # (pvemock.LoadFixture + a Go-level mutation, the same "mutate a
        # freshly-loaded Fixture in Go" pattern
        # TestNetworkStaging_FixtureDefaultFailureInjection uses) to probe
        # the identical tuple with both a reachable and an unreachable
        # scripted outcome; the entry below is this fixture's own
        # declarative default/example.
        agent_exec_outcomes:
          - proto: tcp
            dst: "10.20.0.102"
            port: 22
            outcome: reachable
            detail: "connected"
          # T-806: a second scripted tuple whose live probe outcome
          # disagrees with its simulated verdict, for the "Verify live" UI's
          # own e2e coverage (web/e2e/simulator.spec.ts). vm-a -> vm-c
          # tcp/2222 has no explicit rule (vm-c's own rules only cover
          # tcp/80 DROP and tcp/22 ACCEPT above), so it falls through to
          # the cluster's default policy_in DROP and the simulator reports
          # a deny verdict; scripting a "reachable" live outcome for the
          # identical tuple produces a genuine, fixture-driven divergence
          # for the map overlay's divergence callout to render — distinct
          # from the tcp/22 entry above (T-802's own Go-level convergence/
          # divergence tests mutate that one in-process rather than relying
          # on a second static table entry).
          - proto: tcp
            dst: "10.20.0.102"
            port: 2222
            outcome: reachable
            detail: "connected (T-806 fixture: scripted divergence — default-policy deny vs. live reachable)"
      "301":
        name: vm-c
        status: running
        config:
          name: vm-c
          cores: "1"
          memory: "512"
          net0: "virtio=BC:24:11:AA:20:02,bridge=vmbr0,tag=100,firewall=1"
          ostype: l26
        firewall:
          enabled: true
          rules:
            - pos: 0
              enabled: true
              type: in
              action: DROP
              proto: tcp
              dport: "80"
              comment: "override: block http on this guest specifically"
            - pos: 1
              enabled: true
              type: in
              action: ACCEPT
              proto: tcp
              dport: "22"
              comment: "T-802: explicit allow case for the live-probe divergence test (tcp/80 above still denies first — rule order preserved)"
        # T-802: vm-c's own live guest-agent-reported address — the probe
        # engine resolves a guest-nic dst's target IP this way (live, never
        # from the inventory graph — see internal/api's
        # resolveProbeTargetIP doc comment), so a guest-nic dst in a
        # POST /simulate/verify request against this fixture resolves to
        # this address without the caller needing to know it up front.
        agent_interfaces:
          - name: eth0
            hardware_address: "BC:24:11:AA:20:02"
            ip_addresses:
              - ip: "10.20.0.102"
                type: ipv4
                prefix: 24
      "303":
        name: vm-d
        status: running
        config:
          name: vm-d
          cores: "1"
          memory: "512"
          net0: "virtio=BC:24:11:AA:20:03,bridge=vmbr0,tag=100,firewall=1"
          ostype: l26
        firewall:
          enabled: true
          rules: []
        # T-802 AC5: a qemu guest whose QEMU guest agent is unreachable —
        # POST /simulate/verify sourced from vm-d must answer 200 with
        # observed.outcome:"error" (the honest "could not attempt the
        # probe" case), never a 5xx.
        agent_unreachable: true
    lxc: {}
    firewall:
      enabled: true
      policy_in: DROP
      policy_out: ACCEPT
      rules: []

  pve2:
    network:
      - iface: lo
        type: loopback
        method: loopback
        autostart: true
      - iface: eno1
        type: eth
        method: manual
        autostart: true
        mtu: 1500
      - iface: eno2
        type: eth
        method: manual
        autostart: true
        mtu: 1500
      - iface: bond0
        type: bond
        method: manual
        autostart: true
        mtu: 1500
        slaves: "eno1 eno2"
        bond_mode: 802.3ad
      - iface: vmbr0
        type: bridge
        method: static
        address: 10.20.0.12/24
        gateway: 10.20.0.1
        autostart: true
        mtu: 1500
        bridge_ports: bond0
        bridge_vlan_aware: false
        comments: "deliberately NOT VLAN-aware (AC2 fixture)"
    links:
      eno1: {mac: "bc:24:11:20:01:01", driver: igb, speed_mbps: 10000, duplex: full, link_up: true}
      eno2: {mac: "bc:24:11:20:01:02", driver: igb, speed_mbps: 10000, duplex: full, link_up: true}
      bond0: {mac: "bc:24:11:20:01:01", link_up: true}
      vmbr0: {mac: "bc:24:11:20:01:01", link_up: true}
    qemu: {}
    lxc:
      "302":
        name: vm-b
        status: running
        config:
          hostname: vm-b
          cores: "1"
          memory: "256"
          net0: "name=eth0,bridge=vmbr0,tag=100,firewall=1"
        firewall:
          enabled: true
          rules: []
    firewall:
      enabled: true
      policy_in: DROP
      policy_out: ACCEPT
      rules: []

# T-803: a vxlan zone whose configured MTU leaves no headroom over this
# fixture's own NICs' MTU (1500) — a real `vxlan_underlay_mtu` firing case,
# complementing evpn-lab.yaml's already-healthy vxlanz/evpnz (mtu 9166 over
# a 9216-mtu underlay, an exact fit with no headroom to spare either way).
sdn:
  zones:
    - id: vxlanz
      type: vxlan
      nodes: [pve1, pve2]
      mtu: 1470 # 1470 + 50 (VXLAN overhead) = 1520 > this fixture's 1500-mtu NICs
      peers: ["10.20.0.11", "10.20.0.12"]
  vnets:
    - id: vnet-vxlan1
      zone: vxlanz
      alias: "vxlan-net"

firewall:
  cluster:
    enabled: true
    policy_in: DROP
    policy_out: ACCEPT
    rules: []

mess: []
