# Dev config for running vnproxd outside a real Proxmox node, per
# planning/tasks/phase-0.md#T-002 acceptance criterion 1:
#
#   vnproxd --config testdata/dev.toml
#
# testdata/certs/dev-{cert,key}.pem is a throwaway self-signed keypair
# checked into the repo for this purpose (see testdata/certs — regenerate
# with openssl if needed, it is not used for anything but local dev/testing).
# Paths below are relative to the repository root, matching how `make dev`
# invokes vnproxd (cwd = repo root). This file's acceptance test is
# TestRunDaemon_DevConfigServesHealth (cmd/vnproxd/devconfig_test.go), which
# runs runDaemon against this config with only the listen port, TLS paths,
# and [storage] paths rewritten for the test environment.

[server]
listen = "127.0.0.1:8007"
tls_cert = "testdata/certs/dev-cert.pem"
tls_key = "testdata/certs/dev-key.pem"
read_only = false
confirm_timeout_default = 120

[pve]
# internal/pvemock (used by `make dev`/`make mockpve`) serves plain HTTP,
# unlike real pveproxy which is always HTTPS — this must stay http:// for
# local dev against the mock; production config always uses https://.
api_url = "http://127.0.0.1:8006"
token_file = "/etc/vnprox/keys/pve-token"
# T-104: internal/pvemock does not implement PVE API-token authentication
# (every token-mode request gets a 401 — a documented T-101 gap), so the
# collectors' PVE client can't use token_file above against it. These
# dev-only fields switch the collectors to ticket auth with the mock
# fixture's built-in root@pam/vnprox-mock user instead; production configs
# never set these, and the daemon then uses token_file exactly as
# documented.
dev_ticket_username = "root@pam"
dev_ticket_password = "vnprox-mock"

[safety]
allow_dangerous_ops = false
# Dev override (audit-phase-2 F-13): the default protected_path lives under
# /etc/pve (pmxcfs), which doesn't exist outside a real PVE node — PUT
# /protected-interfaces would 500 on MkdirAll there. Relative path resolves
# under the repo root like the [storage] paths below.
protected_path = "var/dev-protected.json"
# Dev sandbox for the host writer (audit-phase-2 F-22): without this, the
# daemon's change engine would stage/reload the REAL /etc/network/interfaces
# when run as root. With it, all interfaces-file operations happen under
# var/dev-host/ (seeded with a fixture) and ifreload is a logged no-op.
dev_interfaces_dir = "var/dev-host"

# T-105: vnprox's own SQLite store + session-secret key. Relative paths
# here resolve under var/ (gitignored) so `make dev` works without root or
# pre-existing /var/lib/vnprox, /etc/vnprox — production installs always
# get absolute paths under those from the real installer.
[storage]
db_path = "var/dev-vnprox.db"
session_key_file = "var/dev-session.key"

# T-301: the peer API's cluster secret. Production defaults to pmxcfs'
# /etc/pve/priv/vnprox/cluster.secret (not present outside a real PVE node);
# this dev-only override keeps `make dev` working without root/pmxcfs,
# mirroring [storage]'s own var/ precedent.
[peer]
secret_path = "var/dev-cluster.secret"

[collect]
pve_interval = "10s"
host_interval = "5s"
lldp_interval = "30s"

# T-505: pve-firewall's log lives at /var/log/pve-firewall.log on a real
# node, which doesn't exist outside one. dev_fixture_dir points the log
# viewer at this repo's static fixture corpus instead (one "<node>.log"
# file per node) — production configs never set this.
[firewalllog]
dev_fixture_dir = "testdata/firewall-logs"

# T-1001: the Prometheus scrape token. Production default is
# /etc/vnprox/keys/metrics.key (root-only, alongside the session key); this
# dev-only override keeps `make dev`/the runDaemon integration tests working
# without root or a pre-existing /etc/vnprox, mirroring [storage]'s own
# var/ precedent above.
[metrics]
key_file = "var/dev-metrics.key"

# T-1107: the blueprint bundle-signing Ed25519 identity + admin-managed
# trusted-signers directory. Production defaults are /etc/vnprox/keys/
# blueprint-signing.key and /etc/vnprox/keys/trusted-signers/ (root-only,
# alongside the session/metrics keys); these dev-only overrides keep
# `make dev`/the runDaemon integration tests working without root or a
# pre-existing /etc/vnprox, mirroring [metrics]' own var/ precedent above.
[blueprint]
signing_key_file = "var/dev-blueprint-signing.key"
trusted_signers_dir = "var/dev-trusted-signers"
