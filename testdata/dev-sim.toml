# T-504's own dev config: identical shape to testdata/dev.toml, but on a
# distinct port pair and pointed at testdata/clusters/sim-lab.yaml instead
# of three-node-vlan.yaml, so web/e2e/simulator.spec.ts can run alongside
# (not instead of) the existing e2e specs' own webServer pair without port
# collisions or fixture cross-contamination — see that spec file's doc
# comment and web/playwright.config.ts's webServer array.

[server]
# T-2108: the Playwright suite logs in ~82 times against one daemon from
# 127.0.0.1 as the same user, which exceeds the production limiter's refill
# rate (10 attempts, one token back every 30s) and earns HTTP 429s partway
# through a full-suite run — surfacing as specs that time out waiting for a
# post-login navigation, and only ever in full-suite runs. The limiter is
# correct; a real operator logs in once and keeps a session. Raised HERE only,
# so every shipped config keeps the production brute-force protection.
dev_login_rate_capacity = 500
dev_login_rate_refill_seconds = 1
listen = "127.0.0.1:18007"
tls_cert = "testdata/certs/dev-cert.pem"
tls_key = "testdata/certs/dev-key.pem"
read_only = false
confirm_timeout_default = 120

[pve]
api_url = "http://127.0.0.1:18006"
token_file = "/etc/vnprox/keys/pve-token"
dev_ticket_username = "root@pam"
dev_ticket_password = "vnprox-mock"

[safety]
allow_dangerous_ops = false
protected_path = "var/dev-sim-protected.json"
dev_interfaces_dir = "var/dev-sim-host"

[storage]
db_path = "var/dev-sim-vnprox.db"
session_key_file = "var/dev-sim-session.key"

[peer]
secret_path = "var/dev-sim-cluster.secret"

[collect]
pve_interval = "10s"
host_interval = "5s"
lldp_interval = "30s"

[metrics]
key_file = "var/dev-sim-metrics.key"

# T-1307: this stack never had a [blueprint] override (unlike dev.toml,
# testdata/dev.toml's own §"T-1107" comment) and so fell back to the
# production default (/etc/vnprox/keys/blueprint-signing.key), which
# doesn't exist and isn't writable without root — vnproxd refused to start
# at all on any host/sandbox without a pre-existing /etc/vnprox, breaking
# every web/e2e spec in this repo's shared webServer array (simulator.spec.ts
# and this task's own diagnose.spec.ts both run against this stack), not
# just this task's own coverage. Mirrors dev.toml's identical var/ override.
[blueprint]
signing_key_file = "var/dev-sim-blueprint-signing.key"
trusted_signers_dir = "var/dev-sim-trusted-signers"
