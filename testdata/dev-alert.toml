# T-1005's own dev config: identical shape to testdata/dev-sim.toml, but on
# a distinct port pair, pointed at the same testdata/clusters/sim-lab.yaml
# fixture (it already scripts a deterministic live-probe divergence for
# vm-a -> vm-c tcp/2222 — see that fixture's doc comment and
# simulator.spec.ts's T-806 test). web/e2e/alert-rules.spec.ts needs its own
# fresh vnproxd instance (not sim-lab's shared T-504/T-806 stack) so the
# divergence tuple it probes is guaranteed never-before-seen by this
# specific daemon's findings engine — a stale/already-notified finding
# would never re-fire a webhook notification (Engine's once-per-transition
# contract, internal/findings/notify.go), which would make this test
# flaky/order-dependent if it shared a stack with simulator.spec.ts.

[server]
# T-2108: the Playwright suite logs in ~82 times against one daemon from
# 127.0.0.1 as the same user, which exceeds the production limiter's refill
# rate (10 attempts, one token back every 30s) and earns HTTP 429s partway
# through a full-suite run — surfacing as specs that time out waiting for a
# post-login navigation, and only ever in full-suite runs. The limiter is
# correct; a real operator logs in once and keeps a session. Raised HERE only,
# so every shipped config keeps the production brute-force protection.
dev_login_rate_capacity = 500
dev_login_rate_refill_seconds = 1
listen = "127.0.0.1:48007"
tls_cert = "testdata/certs/dev-cert.pem"
tls_key = "testdata/certs/dev-key.pem"
read_only = false
confirm_timeout_default = 120

[pve]
api_url = "http://127.0.0.1:48006"
token_file = "/etc/vnprox/keys/pve-token"
dev_ticket_username = "root@pam"
dev_ticket_password = "vnprox-mock"

[safety]
allow_dangerous_ops = false
protected_path = "var/dev-alert-protected.json"
dev_interfaces_dir = "var/dev-alert-host"

[storage]
db_path = "var/dev-alert-vnprox.db"
session_key_file = "var/dev-alert-session.key"

[peer]
secret_path = "var/dev-alert-cluster.secret"

[collect]
pve_interval = "10s"
host_interval = "5s"
lldp_interval = "30s"

# T-1001 (Prometheus exporter, landed after this file): the default scrape
# token path (/etc/vnprox/keys/metrics.key) needs root — every other
# dev-*.toml overrides this under var/ for exactly that reason. Missing
# here until this task's e2e run surfaced it (any web/e2e spec boots every
# webServer entry in playwright.config.ts, so a missing override here
# broke the whole suite locally, not just alert-rules.spec.ts's own stack).
[metrics]
key_file = "var/dev-alert-metrics.key"

# T-1307: blueprint signing (T-1107, landed after this file) needs the same
# var/ override every other key/token path above already has — missing
# here broke vnproxd startup for this stack (and so the whole shared
# web/e2e run) on any host/sandbox without a pre-existing, writable
# /etc/vnprox, the exact same class of gap this file's own comment above
# already documents for T-1001's metrics token.
[blueprint]
signing_key_file = "var/dev-alert-blueprint-signing.key"
trusted_signers_dir = "var/dev-alert-trusted-signers"
