name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    # Single amd64 job for now: the repo skeleton has nothing yet that needs
    # an arm64 build-only leg or a frontend/deb artifact upload (T-005/T-006).
    # Extend this matrix per docs/development.md once those tasks land.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: make check
        run: make check
