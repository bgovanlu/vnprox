name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: make check
        run: make check

  cross-arm64:
    # Build-only leg per docs/development.md ("make check matrix (amd64;
    # arm64 build-only)"): internal/host (T-102) is real-OS Linux code
    # (netlink, raw ethtool ioctls, /proc, /sys) that must at least compile
    # for arm64 Proxmox nodes even though this CI fleet only runs amd64.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Cross-compile for linux/arm64
        run: GOOS=linux GOARCH=arm64 go build ./...
