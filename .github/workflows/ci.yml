name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: make check
        run: make check

  cross-arm64:
    # Build-only leg per docs/development.md ("make check matrix (amd64;
    # arm64 build-only)"): internal/host (T-102) is real-OS Linux code
    # (netlink, raw ethtool ioctls, /proc, /sys) that must at least compile
    # for arm64 Proxmox nodes even though this CI fleet only runs amd64.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Cross-compile for linux/arm64
        run: GOOS=linux GOARCH=arm64 go build ./...

  fuzz:
    # Runs the interfaces(5) parser fuzzer for the 60s T-102's acceptance
    # criteria require (accept => byte-identical render; reject => typed
    # *ParseError; never panic). A separate job so the minute of fuzzing
    # runs in parallel with `check` instead of stretching its critical path.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Fuzz the interfaces(5) parser
        run: go test -run='^$' -fuzz=FuzzParse -fuzztime=60s ./internal/host/

  package:
    # Production build + .deb artifact per docs/development.md ("frontend
    # build, `make deb` artifact upload"). `make build` exercises the real
    # `npm ci && npm run build` production path (make check only runs
    # vitest/eslint/tsc) and `make deb` packages the result.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: make build
        run: make build

      - name: make deb
        run: make deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: vnprox-deb
          path: dist/*.deb
          if-no-files-found: error
