name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Populate web/node_modules from the lockfile so `make check`'s lint
      # step runs the *pinned* eslint via node_modules/.bin. Without this,
      # `npx eslint` finds no local install and fetches the latest published
      # eslint standalone (e.g. 10.7.0), which can't resolve @eslint/js and
      # fails the whole job — unrelated to the code under test.
      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: make check
        run: make check

  # T-1806-bug-01: the Playwright suite existed for three arcs and was run by
  # nothing. Task reports across those arcs cite passing e2e specs as
  # evidence; none of those claims had been re-checked since the day it was
  # written. This job is what makes them checkable again.
  #
  # Kept as its own job rather than folded into `make check`: it needs a
  # downloaded Chromium and free ports, so a developer running `make check`
  # on a laptop should not pay for it. `make e2e` runs the identical command
  # locally.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # BLOCKING as of 2026-08-07 (T-2108 AC2). It was `continue-on-error: true`
    # from the day the job landed, while the suite was red: 29 failures on the
    # first full run. That backlog is now triaged and closed — the suite runs
    # 89 passed / 0 failed / 2 skipped, the two skips being microseg's own
    # documented `test.skip`s.
    #
    # The failures were worth the trouble. They included the guest-interior
    # API rejecting every request a browser ever made, a render loop that made
    # the whole app unable to navigate away from the Topology page, an SDN
    # wizard that could not be completed, an LLDP check that warned on every
    # neighbour, and four WCAG AA contrast defects — none of which any unit
    # test could see, several of which had green unit tests sitting on top of
    # fixtures that invented the shape the code expected.
    #
    # If this job goes red, the fix is to fix it. Re-adding continue-on-error
    # puts the suite back in the state that let all of the above ship.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run the end-to-end suite
        run: make e2e

      # Traces are retain-on-failure (playwright.config.ts), so this uploads
      # only what is needed to diagnose a red run.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

  cross-arm64:
    # Build-only leg per docs/development.md ("make check matrix (amd64;
    # arm64 build-only)"): internal/host (T-102) is real-OS Linux code
    # (netlink, raw ethtool ioctls, /proc, /sys) that must at least compile
    # for arm64 Proxmox nodes even though this CI fleet only runs amd64.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Cross-compile for linux/arm64
        run: GOOS=linux GOARCH=arm64 go build ./...

  fuzz:
    # Runs every untrusted/external-input parser's fuzz target for a short
    # 60s-each budget (T-604 acceptance criterion 5: "All fuzz targets run
    # in CI (short) ... clean"). A separate job so the several minutes of
    # fuzzing run in parallel with `check` instead of stretching its
    # critical path. See docs/security-verification.md's fuzz inventory for
    # why each of these (and no others) is in scope, and planning/reports/
    # T-604.md for the local 10-minute combined soak this short CI budget
    # stands in for on every push.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      # T-1806: `-fuzz` takes an unanchored regexp match against every fuzz
      # target *in the package under test*. `internal/host` alone has five
      # (FuzzParse, FuzzParseBGPSummary, FuzzParseEVPNVNI, FuzzParseLLDP,
      # FuzzParseDHCPLeases), so an unanchored `-fuzz=FuzzParse` matched all
      # five and `go test` refused to run any of them ("will not fuzz, -fuzz
      # matches more than one fuzz test") — 100% reproducible, independent of
      # the diff, on every push. Anchoring with `^...$` selects exactly one
      # target per step; every step below is anchored on the same principle
      # even where today's package only has one match, so a future sibling
      # fuzz target added to that package can't silently break it again.
      - name: Fuzz the interfaces(5) parser
        run: go test -run='^$' -fuzz='^FuzzParse$' -fuzztime=60s ./internal/host/

      - name: Fuzz the peer HMAC signature parser/verifier
        run: go test -run='^$' -fuzz='^FuzzPeerAuth$' -fuzztime=60s ./internal/peer/

      - name: Fuzz the FRR `show bgp summary json` parser
        run: go test -run='^$' -fuzz='^FuzzParseBGPSummary$' -fuzztime=60s ./internal/host/

      - name: Fuzz the FRR `show evpn vni json` parser
        run: go test -run='^$' -fuzz='^FuzzParseEVPNVNI$' -fuzztime=60s ./internal/host/

      - name: Fuzz the lldpctl JSON parser
        run: go test -run='^$' -fuzz='^FuzzParseLLDP$' -fuzztime=60s ./internal/host/

      - name: Fuzz the dnsmasq DHCP lease-file parser
        run: go test -run='^$' -fuzz='^FuzzParseDHCPLeases$' -fuzztime=60s ./internal/host/

      - name: Fuzz the PVE firewall log-line parser
        run: go test -run='^$' -fuzz='^FuzzParseAll$' -fuzztime=60s ./internal/fwlog/

  package:
    # Production build + .deb artifact per docs/development.md ("frontend
    # build, `make deb` artifact upload"). `make build` exercises the real
    # `npm ci && npm run build` production path (make check only runs
    # vitest/eslint/tsc) and `make deb` packages the result.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: make build
        run: make build

      - name: make deb
        run: make deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: vnprox-deb
          path: dist/*.deb
          if-no-files-found: error
