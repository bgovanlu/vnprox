version: "2"
linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    govet:
      enable-all: true
    revive:
      rules:
        - name: package-comments
        - name: error-strings
        - name: unreachable-code
    # T-501: internal/fw is documented (its own doc.go) as a pure,
    # I/O-free resolution engine — "operates only on the Snapshot value
    # passed in ... does no I/O of its own" — because it is the exact
    # substrate T-503's path simulator is specified to reuse, and a
    # simulator whose core logic can reach the network/filesystem/a
    # database is not the "pure over an inventory snapshot" library either
    # task card requires. This rule is the acceptance-criterion-5 lint
    # enforcement (package review alone is not durable against a later,
    # unrelated change quietly adding an import); it only restricts this
    # one package — no other package's import graph is affected. Only
    # deny-listed here rather than turning on a package-wide allowlist:
    # requiring an explicit allow list this small would need constant
    # upkeep as unrelated stdlib packages get used (strings, sort, fmt,
    # errors, ...), where the deny list only needs a new line if this
    # package ever tries to import something that does I/O or reaches
    # outside its own snapshot.
    depguard:
      rules:
        fw-purity:
          files:
            - "**/internal/fw/**"
          deny:
            - pkg: net
              desc: "internal/fw must stay pure (T-501): no network imports"
            - pkg: net/http
              desc: "internal/fw must stay pure (T-501): no network imports"
            - pkg: os
              desc: "internal/fw must stay pure (T-501): no OS/filesystem imports"
            - pkg: os/exec
              desc: "internal/fw must stay pure (T-501): no subprocess execution"
            - pkg: io
              desc: "internal/fw must stay pure (T-501): no I/O"
            - pkg: database/sql
              desc: "internal/fw must stay pure (T-501): no database access"
            - pkg: github.com/bgovanlu/vnprox/internal/pve
              desc: "internal/fw must stay pure (T-501): no direct PVE API client access — callers pass in a Snapshot"
            - pkg: github.com/bgovanlu/vnprox/internal/pvemock
              desc: "internal/fw must stay pure (T-501): no mock server access"
            - pkg: github.com/bgovanlu/vnprox/internal/peer
              desc: "internal/fw must stay pure (T-501): no peer/network access"
            - pkg: github.com/bgovanlu/vnprox/internal/store
              desc: "internal/fw must stay pure (T-501): no SQLite/app-store access"
            - pkg: github.com/bgovanlu/vnprox/internal/host
              desc: "internal/fw must stay pure (T-501): no host I/O access"
            - pkg: github.com/bgovanlu/vnprox/internal/api
              desc: "internal/fw must stay pure (T-501): no HTTP layer access (wrong dependency direction anyway)"
            - pkg: github.com/bgovanlu/vnprox/internal/change
              desc: "internal/fw must stay pure (T-501): no change-engine access (that package itself talks to PVE/host)"
            - pkg: nhooyr.io/websocket
              desc: "internal/fw must stay pure (T-501): no networking"
        # T-503: internal/sim (the path simulator) has the identical purity
        # contract as internal/fw — its task card requires "pure over an
        # inventory snapshot ... no I/O imports, lint-enforced". It legitimately
        # needs net/netip for pure IP/CIDR arithmetic (subnet membership), so
        # the network denial is scoped to net/http rather than all of net.
        sim-purity:
          files:
            - "**/internal/sim/**"
          deny:
            - pkg: net/http
              desc: "internal/sim must stay pure (T-503): no HTTP/network I/O (net/netip is fine — pure address math)"
            - pkg: os
              desc: "internal/sim must stay pure (T-503): no OS/filesystem imports"
            - pkg: os/exec
              desc: "internal/sim must stay pure (T-503): no subprocess execution"
            - pkg: io
              desc: "internal/sim must stay pure (T-503): no I/O"
            - pkg: database/sql
              desc: "internal/sim must stay pure (T-503): no database access"
            - pkg: github.com/bgovanlu/vnprox/internal/pve
              desc: "internal/sim must stay pure (T-503): no direct PVE API client access — callers pass in a Snapshot"
            - pkg: github.com/bgovanlu/vnprox/internal/pvemock
              desc: "internal/sim must stay pure (T-503): no mock server access"
            - pkg: github.com/bgovanlu/vnprox/internal/collect
              desc: "internal/sim must stay pure (T-503): no collector access"
            - pkg: github.com/bgovanlu/vnprox/internal/peer
              desc: "internal/sim must stay pure (T-503): no peer/network access"
            - pkg: github.com/bgovanlu/vnprox/internal/store
              desc: "internal/sim must stay pure (T-503): no SQLite/app-store access"
            - pkg: github.com/bgovanlu/vnprox/internal/host
              desc: "internal/sim must stay pure (T-503): no host I/O access"
            - pkg: github.com/bgovanlu/vnprox/internal/api
              desc: "internal/sim must stay pure (T-503): no HTTP layer access (wrong dependency direction anyway)"
            - pkg: github.com/bgovanlu/vnprox/internal/change
              desc: "internal/sim must stay pure (T-503): no change-engine access (that package itself talks to PVE/host)"
            - pkg: nhooyr.io/websocket
              desc: "internal/sim must stay pure (T-503): no networking"
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      # web/node_modules (T-005) is npm-managed and not part of this Go
      # module's own source; golangci-lint's own file walk isn't governed
      # by go.mod boundaries the way `go build ./...` mostly is, so
      # without this it lints whatever stray .go files an npm package
      # happens to ship (e.g. vitest's "flatted" dependency bundles a
      # reference Go implementation under node_modules/flatted/golang/).
      - node_modules
      # .claude/worktrees (isolated git worktrees for parallel sub-agent
      # tasks) each carry their own go.mod, so Go's own ./... tooling
      # already treats them as separate modules and skips them — but
      # golangci-lint's file walk isn't module-aware, so exclude explicitly.
      - \.claude
    rules:
      # docs/development.md locks the WS dependency to nhooyr.io/websocket;
      # its upstream module itself (not any one deprecated symbol vnprox
      # could swap for a non-deprecated alternative) is what's marked
      # deprecated in favor of the coder/websocket fork — every exported
      # symbol in the package carries the same SA1019 notice. T-106
      # (internal/topology's WS hub) uses this package because that's the
      # locked decision, not an oversight; re-litigating the dependency
      # choice is out of scope for that task, so this silences the
      # unavoidable deprecation notice rather than every call site needing
      # its own //nolint.
      - path: internal/topology/hub(_test)?\.go
        linters:
          - staticcheck
        text: "SA1019"
      - path: internal/topology/integration_test\.go
        linters:
          - staticcheck
        text: "SA1019"
      # T-601's WS load test (AC4: 200 subscribed entities, no backpressure
      # collapse) drives the real production WS handler with real client
      # connections — same locked nhooyr.io/websocket dependency, same
      # unavoidable module-wide deprecation notice as the hub.go exclusion
      # above, not a fresh dependency choice to re-litigate here either.
      - path: internal/metrics/loadtest_test\.go
        linters:
          - staticcheck
        text: "SA1019"
      # T-1104's WS "events" topic tests dial real nhooyr.io/websocket
      # clients against internal/topology.Hub.ServeWS directly (automation-
      # scope gating, CloseByTokenID force-close) — same locked dependency,
      # same unavoidable module-wide deprecation notice as the hub.go
      # exclusion above.
      - path: internal/topology/hub_events_test\.go
        linters:
          - staticcheck
        text: "SA1019"
      # T-1104's events-topic integration test drives a real WS client
      # against internal/change.Service + internal/topology.Service wired
      # together (changeset.status then audit.appended ordering) — same
      # locked dependency, same unavoidable notice.
      - path: internal/change/events_integration_test\.go
        linters:
          - staticcheck
        text: "SA1019"
      # T-2805 AC3 ("a disconnected session's locks are released, asserted by
      # dropping the connection") can only be asserted by dialling a real WS
      # client and killing it — same locked nhooyr.io/websocket dependency,
      # same unavoidable module-wide deprecation notice as the hub.go
      # exclusion above.
      - path: internal/presence/ws_disconnect_test\.go
        linters:
          - staticcheck
        text: "SA1019"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      # web/node_modules (T-005) is npm-managed and not part of this Go
      # module's own source; golangci-lint's own file walk isn't governed
      # by go.mod boundaries the way `go build ./...` mostly is, so
      # without this it lints whatever stray .go files an npm package
      # happens to ship (e.g. vitest's "flatted" dependency bundles a
      # reference Go implementation under node_modules/flatted/golang/).
      - node_modules
      - \.claude
