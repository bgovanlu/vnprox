version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    govet:
      enable-all: true
    revive:
      rules:
        - name: package-comments
        - name: error-strings
        - name: unreachable-code
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      # web/node_modules (T-005) is npm-managed and not part of this Go
      # module's own source; golangci-lint's own file walk isn't governed
      # by go.mod boundaries the way `go build ./...` mostly is, so
      # without this it lints whatever stray .go files an npm package
      # happens to ship (e.g. vitest's "flatted" dependency bundles a
      # reference Go implementation under node_modules/flatted/golang/).
      - node_modules
      # .claude/worktrees (isolated git worktrees for parallel sub-agent
      # tasks) each carry their own go.mod, so Go's own ./... tooling
      # already treats them as separate modules and skips them — but
      # golangci-lint's file walk isn't module-aware, so exclude explicitly.
      - \.claude
    rules:
      # docs/development.md locks the WS dependency to nhooyr.io/websocket;
      # its upstream module itself (not any one deprecated symbol vnprox
      # could swap for a non-deprecated alternative) is what's marked
      # deprecated in favor of the coder/websocket fork — every exported
      # symbol in the package carries the same SA1019 notice. T-106
      # (internal/topology's WS hub) uses this package because that's the
      # locked decision, not an oversight; re-litigating the dependency
      # choice is out of scope for that task, so this silences the
      # unavoidable deprecation notice rather than every call site needing
      # its own //nolint.
      - path: internal/topology/hub(_test)?\.go
        linters:
          - staticcheck
        text: "SA1019"
      - path: internal/topology/integration_test\.go
        linters:
          - staticcheck
        text: "SA1019"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      # web/node_modules (T-005) is npm-managed and not part of this Go
      # module's own source; golangci-lint's own file walk isn't governed
      # by go.mod boundaries the way `go build ./...` mostly is, so
      # without this it lints whatever stray .go files an npm package
      # happens to ship (e.g. vitest's "flatted" dependency bundles a
      # reference Go implementation under node_modules/flatted/golang/).
      - node_modules
      - \.claude
