# vnprox daemon configuration — see docs/deployment.md
# ("Configuration file — /etc/vnprox/vnprox.toml") for the full reference.
#
# This file is a conffile: `apt upgrade`/`apt install --reinstall` will
# never silently overwrite local edits (dpkg will prompt on conflicting
# changes). Unknown keys are logged as warnings by vnproxd, not treated as
# fatal, so it is safe to have a slightly newer or older vnproxd read an
# older or newer version of this file across an upgrade.

[server]
listen = "0.0.0.0:8007"
# tls_cert / tls_key: left unset by default, which means "reuse the node's
# PVE certificate" (/etc/pve/local/pve-ssl.{pem,key}), matching pveproxy's
# own cert story (docs/architecture.md §9). Uncomment both to override:
# tls_cert = "/etc/vnprox/tls/vnprox.pem"
# tls_key  = "/etc/vnprox/tls/vnprox.key"
read_only = false
confirm_timeout_default = 120

[pve]
api_url = "https://127.0.0.1:8006"
token_file = "/etc/vnprox/keys/pve-token"

[safety]
allow_dangerous_ops = false

# vnprox's own app-owned state (sessions, changesets, snapshots, audit,
# layouts) and the session-secret encryption key. Values below are the
# built-in defaults (docs/deployment.md).
[storage]
db_path = "/var/lib/vnprox/vnprox.db"
session_key_file = "/etc/vnprox/keys/session.key"

[collect]
pve_interval = "10s"
host_interval = "5s"
lldp_interval = "30s"

# Time-machine snapshot retention (T-206). committed-changeset snapshots
# are always kept at least snapshot_pin_days, even if snapshot_keep_days
# is configured shorter (docs/features/change-management.md §4's 7-day
# manual-rollback window).
[retention]
snapshot_keep_days = 90
snapshot_pin_days = 7

# Automatic config snapshots (T-2401) — OFF by default.
#
# vnprox already snapshots around every change IT makes. This covers the
# changes it does not: someone editing /etc/network/interfaces over ssh and
# running `ifreload -a`. Without it, the drift checker will tell you what
# changed and you will have no restore point from before it.
#
# Captures are de-duplicated by content, so an idle cluster accumulates one
# row no matter how often the timer fires. snapshot_schedule_keep bounds the
# rest, oldest pruned first, and can only ever delete `scheduled` snapshots —
# never a changeset's rollback point or a manual snapshot.
# snapshot_schedule_interval = "1h"
# snapshot_schedule_keep = 48

# Flow ingestion/sampling (T-1002/T-1004) — every source below is off by
# default and opt-in per node; uncomment to enable on this node only.
# [flows]
# sflow_enabled = false
# netflow_enabled = false
# ipfix_enabled = false
# conntrack_sampling_enabled = false   # periodic /proc/net/nf_conntrack poll; no extra capability needed
# ebpf_sampling_enabled = false        # needs CAP_BPF/CAP_PERFMON — see docs/security.md's Host footprint
#                                       # section; setting this to true and reinstalling/upgrading is what
#                                       # grants those capabilities to vnprox.service (never unconditional)
# host_sample_interval_sec = 10        # shared poll interval for both host-local samplers above

# Blueprint & plugin hub (T-1705) — an opt-in client for a public registry of
# signed blueprint bundles and SDK plugins. Off by default: leave registry_url
# empty (or this whole section commented) and the hub routes are not mounted.
# The registry is static hosting (index.json + an artifact tree), not a service
# — see docs/hub-registry.md. Installs still pass the full Ed25519 signature +
# trust-store gate.
# [hub]
# registry_url = "https://hub.example.com/vnprox"
# vetted_signers = []   # hex signer fingerprints shown a "vetted" badge; purely
#                       # informational — never bypasses the per-install trust
#                       # decision (a vetted-but-untrusted signer still prompts)
# index_signers = []    # T-2803: fingerprints allowed to sign the registry's
#                       # index.json. Set this whenever registry_url is set: with
#                       # it, an index that is unsigned, corrupted, or signed by
#                       # another key is refused whole (no partial catalog), and
#                       # the revocations published inside the signed index are
#                       # enforced offline on every artifact fetch. Leaving it
#                       # empty logs a warning at startup and keeps the pre-T-2803
#                       # behaviour: an unauthenticated catalog, no revocation.
#                       # It says who may publish the CATALOG — it never makes an
#                       # artifact trusted.
#
# sig_mode = "ed25519" # T-3709: which index-trust scheme is in force —
#                       # "ed25519" (the default; index_signers above) or
#                       # "sigstore" (full sigstore-go verification: Fulcio
#                       # cert chain, Rekor transparency-log inclusion, and
#                       # certificate identity, over a sibling
#                       # index.json.sigstore.json bundle — no local key,
#                       # keyless OIDC-bound signing instead). Explicit
#                       # config, never inferred from what a served index
#                       # looks like — see docs/hub-registry.md's
#                       # "Sigstore-signed registries" section, including
#                       # what this adds to the trust path (Fulcio/Rekor/TUF)
#                       # and how revocation works with no key to rotate.
# sigstore_issuer            = ""   # exact expected OIDC issuer, e.g.
#                                   # "https://token.actions.githubusercontent.com"
# sigstore_issuer_regexp     = ""   # regexp form; at least one of the two issuer
#                                   # keys is required when sig_mode = "sigstore"
# sigstore_identity          = ""   # exact expected certificate subject, e.g. a
#                                   # GitHub Actions workflow ref
#                                   # ("https://github.com/<owner>/<repo>/.github/
#                                   # workflows/publish-registry.yml@refs/heads/main")
# sigstore_identity_regexp   = ""   # regexp form; at least one of the two identity
#                                   # keys is required when sig_mode = "sigstore"
# sigstore_trusted_root_file = ""   # optional: pin a local copy of the
#                                   # Fulcio/Rekor/CT trust roots instead of
#                                   # fetching the Sigstore public-good
#                                   # instance's current roots live via TUF
#                                   # on every daemon startup

# Opt-in compatibility telemetry (T-2503) — OFF, and this whole section is
# commented out on purpose.
#
# What it would send is a `vnproxctl verify` run reduced to: check ids and
# verdicts, the vnprox/PVE/kernel versions, the NICs' PCI vendor:device ids,
# and a node COUNT. Never a hostname, an address, a MAC, a guest name or the
# cluster name — docs/security.md ("Compatibility telemetry") lists every
# field, and `vnproxctl telemetry preview --report <file>` prints the exact
# bytes that would leave this machine.
#
# There is NO default endpoint: vnprox runs no telemetry service, so opting
# in means naming an https collector yourself. enabled = true without an
# endpoint is a fatal config error rather than a quiet no-op — an operator
# who opted in should never be silently sending nothing.
# [telemetry]
# enabled = false
# endpoint = "https://telemetry.example.com/vnprox/compat"
