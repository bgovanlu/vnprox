# vnprox daemon configuration — see docs/deployment.md
# ("Configuration file — /etc/vnprox/vnprox.toml") for the full reference.
#
# This file is a conffile: `apt upgrade`/`apt install --reinstall` will
# never silently overwrite local edits (dpkg will prompt on conflicting
# changes). Unknown keys are logged as warnings by vnproxd, not treated as
# fatal, so it is safe to have a slightly newer or older vnproxd read an
# older or newer version of this file across an upgrade.

[server]
listen = "0.0.0.0:8007"
# tls_cert / tls_key: left unset by default, which means "reuse the node's
# PVE certificate" (/etc/pve/local/pve-ssl.{pem,key}), matching pveproxy's
# own cert story (docs/architecture.md §9). Uncomment both to override:
# tls_cert = "/etc/vnprox/tls/vnprox.pem"
# tls_key  = "/etc/vnprox/tls/vnprox.key"
read_only = false
confirm_timeout_default = 120

[pve]
api_url = "https://127.0.0.1:8006"
token_file = "/etc/vnprox/keys/pve-token"

[safety]
allow_dangerous_ops = false

# vnprox's own app-owned state (sessions, changesets, snapshots, audit,
# layouts) and the session-secret encryption key. Values below are the
# built-in defaults (docs/deployment.md).
[storage]
db_path = "/var/lib/vnprox/vnprox.db"
session_key_file = "/etc/vnprox/keys/session.key"

[collect]
pve_interval = "10s"
host_interval = "5s"
lldp_interval = "30s"

# Time-machine snapshot retention (T-206). committed-changeset snapshots
# are always kept at least snapshot_pin_days, even if snapshot_keep_days
# is configured shorter (docs/features/change-management.md §4's 7-day
# manual-rollback window).
[retention]
snapshot_keep_days = 90
snapshot_pin_days = 7

# Flow ingestion/sampling (T-1002/T-1004) — every source below is off by
# default and opt-in per node; uncomment to enable on this node only.
# [flows]
# sflow_enabled = false
# netflow_enabled = false
# ipfix_enabled = false
# conntrack_sampling_enabled = false   # periodic /proc/net/nf_conntrack poll; no extra capability needed
# ebpf_sampling_enabled = false        # needs CAP_BPF/CAP_PERFMON — see docs/security.md's Host footprint
#                                       # section; setting this to true and reinstalling/upgrading is what
#                                       # grants those capabilities to vnprox.service (never unconditional)
# host_sample_interval_sec = 10        # shared poll interval for both host-local samplers above

# Blueprint & plugin hub (T-1705) — an opt-in client for a public registry of
# signed blueprint bundles and SDK plugins. Off by default: leave registry_url
# empty (or this whole section commented) and the hub routes are not mounted.
# vnprox ships the client only; the registry service (index + artifacts) lives
# elsewhere. Installs still pass the full Ed25519 signature + trust-store gate.
# [hub]
# registry_url = "https://hub.example.com/vnprox"
# vetted_signers = []   # hex signer fingerprints shown a "vetted" badge; purely
#                       # informational — never bypasses the per-install trust
#                       # decision (a vetted-but-untrusted signer still prompts)
